app = "glasspitch-x402"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "4021"
  DECK_PRICE_USD = "1.00"
  FACILITATOR_URL = "https://facilitator.goplausible.xyz"

[http_service]
  internal_port = 4021
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.checks]
    [http_service.checks.health]
      grace_period = "10s"
      interval = "30s"
      timeout = "5s"
      method = "GET"
      path = "/health"
