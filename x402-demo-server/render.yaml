services:
  - type: web
    name: glasspitch-x402
    runtime: docker
    rootDir: x402-demo-server
    dockerfilePath: Dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "4021"
      - key: DECK_PRICE_USD
        value: "1.00"
      - key: FACILITATOR_URL
        value: https://facilitator.goplausible.xyz
      - key: AVM_ADDRESS
        sync: false
